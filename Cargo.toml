[workspace]
resolver = "2"
members = [
    "crates/bytetrawl-core",
    "crates/bytetrawl-format",
    "crates/bytetrawl-analysis",
    "crates/bytetrawl-signature",
    "crates/bytetrawl-tools",
    "crates/bytetrawl-cli",
    "crates/bytetrawl-ui",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
ignore = "0.4"
goblin = "0.10"
memmap2 = "0.9"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
plist = "1.8"
quick-xml = { version = "0.38", features = ["serialize"] }
zip = { version = "4.3", default-features = false, features = ["deflate"] }
authenticode = { version = "0.6", features = ["std"] }
imagesize = "0.15"
parking_lot = "0.12"
indexmap = { version = "2.9", features = ["serde"] }
gpui = "0.2.2"
gpui-component = "0.5.1"
rfd = "0.15"
wait-timeout = "0.2.1"
udif = { version = "0.3.4", default-features = false }
tar = "0.4"
apple-xar = { version = "0.20", default-features = false }
flate2 = "1.1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "symbols"
