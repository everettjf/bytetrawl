name: Package Windows and Linux

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-windows
      - name: Build MSI and portable ZIP
        shell: pwsh
        run: scripts/package-windows.ps1
      - name: Inspect MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/*.msi | Select-Object -First 1
          if (-not $msi -or $msi.Length -eq 0) { throw "MSI was not created" }
          Get-FileHash $msi.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: bytetrawl-windows-x64
          path: |
            dist/*.msi
            dist/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libssl-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-linux
      - name: Build DEB and portable tarball
        run: scripts/package-linux.sh
      - name: Verify package contents and dependencies
        run: |
          deb=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb --contents "$deb" | grep -q './usr/bin/bytetrawl$'
          dpkg-deb --contents "$deb" | grep -q './usr/bin/bytetrawl-cli$'
      - uses: actions/upload-artifact@v4
        with:
          name: bytetrawl-linux-amd64
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bytetrawl-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
